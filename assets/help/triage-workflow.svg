<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Emergency Management triage workflow</title><desc id="d">Annotated triage screen showing polygon context, relocatable centroid point, incident fields, Emergency Management record creation, and Workflow Manager audit.</desc><style>.bg{fill:#071824}.panel{fill:#0c2231;stroke:#28495b;stroke-width:2}.alt{fill:#123247}.gold{fill:#f2a900}.green{fill:#28c79a}.red{fill:#e03649}.txt{fill:#f4f7f9;font:700 22px Arial}.sm{fill:#afc3cf;font:16px Arial}.xs{fill:#afc3cf;font:13px Arial}.num{fill:#071824;stroke:#f2a900;stroke-width:5}.n{fill:#f2a900;font:700 25px Arial;text-anchor:middle;dominant-baseline:middle}.line{stroke:#f2a900;stroke-width:4;fill:none}</style><rect class="bg" width="1200" height="680"/><rect class="panel" x="28" y="22" width="1144" height="636"/><text class="sm" x="54" y="54">EMERGENCY MANAGEMENT SOLUTION</text><text class="txt" x="54" y="84">Triage impacted area</text><text class="sm" x="54" y="109">Selected planning polygon and initial incident point</text><g><rect class="alt" x="54" y="130" width="250" height="50"/><rect class="alt" x="314" y="130" width="250" height="50"/><rect class="alt" x="574" y="130" width="250" height="50"/><rect class="alt" x="834" y="130" width="312" height="50"/></g><text class="sm" x="72" y="161">1  Select polygon</text><text class="sm" x="332" y="161">2  Confirm incident</text><text class="sm" x="592" y="161">3  Create incident features</text><text class="sm" x="852" y="161">4  Open manager</text><g><rect class="panel" x="54" y="196" width="480" height="72"/><rect class="panel" x="544" y="196" width="280" height="72"/><rect class="panel" x="834" y="196" width="312" height="72"/></g><text class="xs" x="70" y="220">SOURCE POLYGON</text><text class="txt" x="70" y="251">Selected planning area</text><text class="xs" x="560" y="220">AREA</text><text class="txt" x="560" y="251">523.8 sq mi</text><text class="xs" x="850" y="220">ESTIMATED POPULATION</text><text class="txt" x="850" y="251">282,251</text><rect class="panel" x="54" y="284" width="720" height="270"/><text class="txt" x="70" y="315">Initial incident point</text><text class="xs" x="70" y="338">Drag the marker to refine the operational location</text><rect x="70" y="352" width="688" height="174" fill="#b8d8e8"/><path d="M140 378 L390 360 L640 430 L565 510 L280 500 L120 440Z" fill="#f2c94c" fill-opacity=".42" stroke="#f2a900" stroke-width="6"/><circle class="red" cx="390" cy="432" r="15" stroke="#fff" stroke-width="5"/><path d="M390 412 V452 M370 432 H410" stroke="#fff" stroke-width="2"/><rect x="594" y="300" width="164" height="34" fill="none" stroke="#f2a900" stroke-width="2"/><text class="xs" x="610" y="322">Reset to centroid</text><text class="xs" x="70" y="546">38.07320, -122.71920</text><rect class="panel" x="790" y="284" width="356" height="270"/><text class="xs" x="810" y="310">INCIDENT NUMBER</text><rect class="alt" x="810" y="320" width="316" height="42"/><text class="sm" x="824" y="347">ELN-YYYYMMDD-UNIQUE</text><text class="xs" x="810" y="388">INCIDENT NAME</text><rect class="alt" x="810" y="398" width="316" height="42"/><text class="sm" x="824" y="425">El Niño impacted area</text><text class="xs" x="810" y="466">DEFAULTS</text><text class="sm" x="810" y="492">Flooding • Active • Primary</text><text class="sm" x="810" y="518">Public: No • Archive: No</text><rect class="green" x="790" y="572" width="356" height="52"/><text x="968" y="605" text-anchor="middle" fill="#071824" font-family="Arial" font-size="18" font-weight="700">Create records + audit</text><text class="xs" x="54" y="612">Writes Impacted Area polygon + Incident Locations point + Workflow Manager audit job</text><circle class="num" cx="1080" cy="95" r="24"/><text class="n" x="1080" y="96">1</text><path class="line" d="M1055 105 L1000 130"/><circle class="num" cx="710" cy="420" r="24"/><text class="n" x="710" y="421">2</text><path class="line" d="M685 420 L412 432"/><circle class="num" cx="1110" cy="345" r="24"/><text class="n" x="1110" y="346">3</text><path class="line" d="M1085 355 L1035 380"/><circle class="num" cx="745" cy="602" r="24"/><text class="n" x="745" y="603">4</text><path class="line" d="M770 602 L790 602"/><circle class="num" cx="1090" cy="602" r="24"/><text class="n" x="1090" y="603">5</text><path class="line" d="M1065 625 L1010 646"/></svg>