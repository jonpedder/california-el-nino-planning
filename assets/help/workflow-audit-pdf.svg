<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Workflow audit PDF output</title><desc id="d">Annotated two-page Workflow audit PDF with map, accountability summary, identifiers, current workflow assignment, and complete timeline.</desc><style>.bg{fill:#071824}.paper{fill:#f7f8f8;stroke:#28495b;stroke-width:3}.navy{fill:#081f2b}.pale{fill:#eaf1f4}.gold{fill:#b15c00}.txt{fill:#f4f7f9;font:700 20px Arial}.dark{fill:#1c2d37;font:700 17px Arial}.sm{fill:#526b78;font:13px Arial}.xs{fill:#526b78;font:11px Arial}.num{fill:#071824;stroke:#f2a900;stroke-width:5}.n{fill:#f2a900;font:700 25px Arial;text-anchor:middle;dominant-baseline:middle}.line{stroke:#f2a900;stroke-width:4;fill:none}</style><rect class="bg" width="1200" height="680"/><text class="txt" x="42" y="42">Workflow Audit PDF</text><text x="42" y="66" fill="#afc3cf" font-family="Arial" font-size="14">Branded, map-based accountability record and complete audit timeline</text><g transform="translate(42 86)"><rect class="paper" width="538" height="540" rx="3"/><rect class="navy" width="538" height="55"/><text class="txt" x="22" y="26">Incident Triage Audit</text><text x="22" y="44" fill="#d7e6ee" font-family="Arial" font-size="10">ELN-YYYYMMDD-UNIQUE • El Niño impacted area</text><rect x="22" y="76" width="292" height="184" fill="#b8d8e8"/><path d="M54 114 L168 91 L283 150 L266 238 L132 244 L47 180Z" fill="#f2c94c" fill-opacity=".45" stroke="#b15c00" stroke-width="5"/><circle cx="168" cy="173" r="10" fill="#e03649" stroke="#fff" stroke-width="3"/><g class="pale"><rect x="328" y="76" width="88" height="72"/><rect x="428" y="76" width="88" height="72"/><rect x="328" y="158" width="88" height="72"/><rect x="428" y="158" width="88" height="72"/><rect x="328" y="240" width="188" height="64"/></g><text class="xs" x="338" y="94">TRIAGED BY</text><text class="dark" x="338" y="121">JonPSO</text><text class="xs" x="438" y="94">TRIAGED AT</te